spring.application.name=adoptapet

# --- GITHUB OAUTH2 (SEGURIDAD REFORZADA) ---
# Usa las variables de Render en la nube y los valores por defecto en tu PC
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:Ov23liOENGsQUC3RgShE}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:806a42311f4eb22fa5766316af25374092863350}
spring.security.oauth2.client.registration.github.scope=read:user
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/github
spring.security.oauth2.client.provider.github.user-name-attribute=login

# --- CONFIGURACIÓN DE BASE DE DATOS (HÍBRIDA) ---
# En Render usará PostgreSQL gracias a las variables de entorno
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/adoptapetdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# Cambio dinámico de Driver y Dialecto para compatibilidad entre MySQL y PostgreSQL
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.MySQL8Dialect}

# Gestión automática de tablas en el arranque
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# --- THYMELEAF ---
