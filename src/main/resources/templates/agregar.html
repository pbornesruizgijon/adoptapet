<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Agregar Mascota - AdoptaPet</title>
    <link rel="stylesheet" href="/base.css">
    <link rel="stylesheet" href="/index.css">
    <style>
        /* Ajuste para que la tarjeta de formulario sea cómoda de leer */
        .admin-card {
            margin: 80px auto;
            position: relative;
            transform: none;
            left: auto;
            top: auto;
            max-width: 550px;
        }

        input[type="file"] {
            padding: 10px;
            background: white;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="hero" style="height: 300px; clip-path: ellipse(100% 100% at 50% 0%);">
        <div class="herotitle" style="font-size: 3em; margin-top: 20px;"
            th:text="${mascota.id != null ? 'Editar Mascota' : 'Nueva Mascota'}">
        </div>
    </div>

    <div class="content login-card admin-card">
        <p style="text-align: center; margin-bottom: 20px;">
            Estás operando como: <strong sec:authentication="name" style="color: #6b4f23;">Admin</strong>
        </p>

        <form th:action="@{/admin/agregar}" th:object="${mascota}" method="post" enctype="multipart/form-data"
            class="auth-container">
            <input type="hidden" th:field="*{id}" />
            <input type="hidden" th:field="*{adoptada}" />

            <input type="hidden" th:field="*{imagen}" />

            <div class="input-group">
                <label>Nombre de la mascota:</label>
                <input type="text" th:field="*{nombre}" placeholder="Ej: Bobby" required />
            </div>

            <div style="display: flex; gap: 15px;">
                <div class="input-group" style="flex: 1;">
                    <label>Edad (años):</label>
                    <input type="number" th:field="*{edad}" min="0" max="30" required />
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>Sexo:</label>
                    <select th:field="*{sexo}" required
                        style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #e0d4c8; margin-top: 5px;">
                        <option value="">Selecciona...</option>
                        <option value="Macho">Macho</option>
                        <option value="Hembra">Hembra</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label>Raza:</label>
                <input type="text" th:field="*{raza}" placeholder="Ej: Labrador, Mestizo..." required />
            </div>

            <div class="input-group">
                <label>Descripción / Historia:</label>
                <textarea th:field="*{descripcion}" rows="4" required
                    style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #e0d4c8; font-family: inherit; margin-top: 5px;"></textarea>
            </div>

            <div class="input-group">
                <label>Foto de la mascota:</label>
                <input type="file" name="file" accept="image/*" />
                <small style="color: #999; font-size: 0.8em;" th:if="${mascota.id != null}">
                    Deja este campo vacío para mantener la foto actual.
                </small>
                <small style="color: #999; font-size: 0.8em;" th:if="${mascota.id == null}">
                    La foto se subirá automáticamente a la nube (Cloudinary).
                </small>
            </div>

            <div th:if="${mascota.id == null}" class="input-group">
                <label>Tipo de Mascota:</label>
                <select name="tipoAnimal" required
                    style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #e0d4c8; margin-top: 5px;">
                    <option value="PERRO">Perro 🐶</option>
                    <option value="GATO">Gato 🐱</option>
                </select>
            </div>

            <button type="submit" class="btn-main"
                th:text="${mascota.id != null ? '💾 Actualizar Cambios' : '🐾 Guardar Mascota'}">
            </button>
        </form>

        <div class="divider">o si prefieres no hacer cambios</div>

        <div style="text-align: center;">
            <a href="/lista" class="btn-outline">← Cancelar y volver</a>
        </div>
    </div>
</body>

</html>
