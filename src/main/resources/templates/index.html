<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>AdoptaPet - Inicio</title>
    <link rel="stylesheet" href="/base.css">
    <link rel="stylesheet" href="/index.css">
</head>

<body>
    <div class="hero">
        <div class="herotitle">AdoptaPet</div>
    </div>

    <div class="content login-card">

        <div sec:authorize="isAuthenticated()">
            <p class="bienvenida" style="font-size: 1.3em; margin-bottom: 5px;">
                ¡Hola, <strong sec:authentication="name" style="color: #6b4f23;">Usuario</strong>! 🐾
            </p>
            <p style="color: #999; font-size: 0.8em; text-align: center; margin-top: 0; margin-bottom: 25px;">
                Rol actual: <span sec:authentication="principal.authorities"></span>
            </p>

            <div class="auth-container">
                <a href="/mis-adopciones" class="btn-outline">
                    📸 Mis Adopciones
                </a>

                <div sec:authorize="hasAuthority('ADMIN')">
                    <a href="/admin/agregar" class="btn-main">
                        + Registrar nueva mascota
                    </a>
                </div>

                <form th:action="@{/logout}" method="post">
                    <button type="submit" style="background: #f5b971; color: white;">
                        Cerrar sesión
                    </button>
                </form>
            </div>
        </div>

        <div sec:authorize="isAnonymous()">
            <h2 style="text-align: center; color: #6b4f23; margin-top: 0;">Iniciar Sesión</h2>

            <p th:if="${param.registroExitoso}"
                style="color: green; text-align: center; background: #e8f5e9; padding: 10px; border-radius: 5px; font-size: 0.9em;">
                ¡Cuenta creada con éxito! Ya puedes entrar.
            </p>

            <form th:action="@{/login}" method="post" class="auth-container">
                <div class="input-group">
                    <label for="username">Usuario:</label>
                    <input type="text" id="username" name="username" placeholder="Tu nombre de usuario" required />
                </div>
                <div class="input-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required />
                </div>

                <p th:if="${param.error}" class="error" style="font-size: 0.8em; text-align: center;">
                    Usuario o contraseña incorrectos.
                </p>

                <button type="submit" class="btn-main">Entrar</button>
            </form>

            <div class="divider">o entra con</div>

            <div style="text-align: center;">
                <a href="/oauth2/authorization/github" class="btn-github">
                    <svg height="16" aria-hidden="true" viewBox="0 0 16 16" version="1.1" width="16"
                        data-view-component="true" style="fill: white; vertical-align: text-bottom; margin-right: 8px;">
                        <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path>
                    </svg>
                    GitHub
                </a>
            </div>

            <div class="divider" style="margin-top: 25px;">¿Eres nuevo en AdoptaPet?</div>

            <div style="text-align: center;">
                <a href="/registro" class="btn-outline">Crear una cuenta nueva</a>
            </div>
        </div>

        <hr style="margin:26px auto 16px auto; width:100%; border:0; border-top:1.5px solid #eee;">
        
        <a href="/lista" class="principal-link" style="background: rgba(126, 212, 166, 0.1); border: 1px solid #7ed4a6;">
            🐾 Ver mascotas disponibles
        </a>
    </div>

    <div class="stats">
        <h3 style="margin:0;">
            Total adoptadas: <span th:text="${totalAdoptadas}">0</span>
        </h3>
    </div>
</body>

</html>
